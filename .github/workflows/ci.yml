name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # jsdom@30 (devDependency) требует Node ^22.22.2 || ^24.15.0 || >=26,
        # поэтому Node 18/20 из матрицы убрать — их задания падали всегда,
        # включая main (см. run 33902064439).
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
