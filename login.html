<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и регистрация</title>
  <link rel="stylesheet" href="assets/auth.css">
</head>
<body>
  <div class="card">
    <h2>Вход / Регистрация</h2>

    <form class="auth-form" id="authForm" autocomplete="on">
      <input type="text" id="username" name="username" placeholder="Логин" autocomplete="username"
             minlength="3" maxlength="32" required>
      <input type="password" id="password" name="password" placeholder="Пароль"
             autocomplete="current-password" minlength="6" maxlength="128" required>

      <div class="btn-row">
        <button type="submit" class="btn" id="loginBtn">Войти</button>
        <button type="button" class="btn btn--secondary" id="registerBtn">Зарегистрироваться</button>
      </div>

      <p class="hint">Логин: 3–32 символа. Пароль: минимум 6 символов.</p>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>

    <div class="links">
      <a href="index.html">Продолжить как гость</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('authForm');
    const messageEl = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');

    function showMessage(text, kind) {
      messageEl.textContent = text;
      messageEl.className = `message message--${kind}`;
    }

    function setBusy(busy) {
      loginBtn.disabled = busy;
      registerBtn.disabled = busy;
    }

    /**
     * Отправляет учётные данные на сервер.
     * Пароль уходит только в теле запроса и нигде не сохраняется на клиенте —
     * состояние входа держит httpOnly-кука сессии.
     */
    async function submitCredentials(endpoint) {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showMessage('Заполните логин и пароль.', 'error');
        return;
      }

      setBusy(true);
      showMessage('Отправляем данные…', 'success');

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok || !result.success) {
          showMessage(result.message || 'Не удалось выполнить запрос.', 'error');
          return;
        }

        showMessage(result.message || 'Готово!', 'success');
        window.location.href = 'userinfo.html';
      } catch (error) {
        console.error(error);
        showMessage('Сервер недоступен. Запустите его командой «npm start».', 'error');
      } finally {
        setBusy(false);
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      submitCredentials('/api/login');
    });

    registerBtn.addEventListener('click', () => submitCredentials('/api/register'));
  </script>
</body>
</html>
