<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Информация о пользователе</title>
  <link rel="stylesheet" href="assets/auth.css">
</head>
<body>
  <div class="card card--wide">
    <h2>Информация о пользователе</h2>

    <div class="section" id="userInfo">
      <p class="hint">Загружаем данные…</p>
    </div>

    <div class="links">
      <a href="index.html">На главную</a>
      <span id="logoutWrapper" hidden> · <a href="#" id="logoutLink">Выйти</a></span>
    </div>
  </div>

  <script>
    const userInfoDiv = document.getElementById('userInfo');
    const logoutWrapper = document.getElementById('logoutWrapper');

    /** Безопасный вывод: значения вставляются через textContent, а не innerHTML. */
    function renderRow(label, value) {
      const row = document.createElement('p');
      const strong = document.createElement('strong');
      strong.textContent = `${label}: `;
      row.appendChild(strong);
      row.appendChild(document.createTextNode(String(value)));
      return row;
    }

    function renderUser(user) {
      const block = document.createElement('div');
      block.className = 'data-block';

      const skills = Array.isArray(user.profile?.skills) ? user.profile.skills : [];

      block.appendChild(renderRow('Логин', user.username));
      block.appendChild(renderRow('Уровень', user.profile?.level ?? 1));
      block.appendChild(renderRow('Опыт (XP)', user.profile?.xp ?? 0));
      block.appendChild(renderRow('Навыки', skills.length ? skills.join(', ') : 'Нет навыков'));
      if (user.createdAt) {
        block.appendChild(renderRow('Регистрация', new Date(user.createdAt).toLocaleString('ru-RU')));
      }

      userInfoDiv.replaceChildren(block);
      logoutWrapper.hidden = false;
    }

    function renderMessage(text) {
      const paragraph = document.createElement('p');
      paragraph.className = 'hint';
      paragraph.textContent = text;

      const link = document.createElement('a');
      link.href = 'login.html';
      link.textContent = 'Перейти ко входу';

      const wrapper = document.createElement('div');
      wrapper.className = 'data-block';
      wrapper.appendChild(paragraph);
      wrapper.appendChild(link);

      userInfoDiv.replaceChildren(wrapper);
    }

    async function loadUser() {
      try {
        const response = await fetch('/api/me', { credentials: 'same-origin' });

        if (response.status === 401) {
          renderMessage('Вы не авторизованы.');
          return;
        }
        if (!response.ok) {
          renderMessage('Не удалось получить данные пользователя.');
          return;
        }

        const result = await response.json();
        renderUser(result.user);
      } catch (error) {
        console.error(error);
        renderMessage('Сервер недоступен. Запустите его командой «npm start».');
      }
    }

    document.getElementById('logoutLink').addEventListener('click', async (event) => {
      event.preventDefault();
      try {
        await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      } catch (error) {
        console.error(error);
      }
      window.location.href = 'index.html';
    });

    loadUser();
  </script>
</body>
</html>
